name: Build and publish Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked build dependencies
        run: python -m pip install --no-deps -r requirements-build.txt

      - name: Verify public source contents
        run: python scripts/verify_public_source.py .

      - name: Build native checksum library
        run: python build_native.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python source
        run: python -m compileall -q app.py sitecustomize.py crimson0020 scripts tests

      - name: Build and smoke-test Windows one-folder release
        shell: pwsh
        run: >-
          python scripts/build_onedir.py
          --output-root "$env:RUNNER_TEMP\crimson-release"

      - name: Create release checksum
        shell: pwsh
        run: |
          $releaseRoot = Join-Path $env:RUNNER_TEMP "crimson-release"
          $zip = Join-Path $releaseRoot "CrimsonDesertLocalizationBuilder-windows-x64.zip"
          $checksum = Join-Path $releaseRoot "SHA256SUMS.txt"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash  CrimsonDesertLocalizationBuilder-windows-x64.zip" | Set-Content -LiteralPath $checksum -Encoding ascii
          "RELEASE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_CHECKSUM=$checksum" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" `
              "$env:RELEASE_ZIP" `
              "$env:RELEASE_CHECKSUM" `
              --repo "$env:GITHUB_REPOSITORY" `
              --clobber
          } else {
            gh release create "$env:GITHUB_REF_NAME" `
              "$env:RELEASE_ZIP" `
              "$env:RELEASE_CHECKSUM" `
              --repo "$env:GITHUB_REPOSITORY" `
              --verify-tag `
              --title "Crimson Desert Localization Builder $env:GITHUB_REF_NAME" `
              --notes "Windows x64 one-folder release."
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed."
          }

      - name: Upload Artifacts (Manual Run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: CrimsonDesertLocalizationBuilder-windows-x64
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_CHECKSUM }}
