name: Windows source verification

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: python -m pip install --no-deps -r requirements-build.txt

      - name: Verify public source contents
        run: python scripts/verify_public_source.py .

      - name: Build native checksum library
        run: python build_native.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python source
        run: python -m compileall -q app.py sitecustomize.py crimson0020 scripts tests

      - name: Build and smoke-test transparent one-folder candidate
        shell: pwsh
        run: >-
          python scripts/build_onedir.py
          --output-root "$env:RUNNER_TEMP\crimson-onedir"
